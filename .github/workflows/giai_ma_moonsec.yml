name: Deobfuscate Lua (MoonSec 3)

on:
  workflow_dispatch:
  push:
    paths:
      - 'input.lua'
      - 'src/deob/**'

jobs:
  deob:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo của bạn (chứa src/deob/pipeline.lua + input.lua)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài Lua 5.1 + LuaRocks (MoonSec / Prometheus thường xài Lua 5.1)
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luasocket
          sudo luarocks install luafilesystem

      # 3. Clone Prometheus về đúng vị trí repo-root/Prometheus/
      # Đổi "levno-710/Prometheus" thành tên repo chuẩn của Prometheus mà bạn muốn dùng
      - name: Checkout Prometheus deobfuscator
        uses: actions/checkout@v4
        with:
          repository: levno-710/Prometheus
          path: Prometheus

      # 4. Kiểm tra xem clone thành công chưa
      - name: Verify Prometheus files
        run: |
          ls -la Prometheus/
          ls -la Prometheus/src/prometheus/

      # 5. Kiểm tra file input.lua có tồn tại
      - name: Check input file
        run: |
          if [ ! -f "input.lua" ]; then
            echo "ERROR: Khong tim thay file input.lua!"
            exit 1
          fi

      # 6. Chạy pipeline
      - name: Run deobfuscation pipeline
        run: |
          export LUA_PATH="src/deob/?.lua;Prometheus/src/?.lua;Prometheus/src/?/init.lua;;"
          lua src/deob/pipeline.lua --input input.lua --output ket_qua_clean.lua

      # 7. Upload kết quả
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ket_qua_clean
          path: ket_qua_clean.lua
