name: Giai Ma MoonSec V3

on:
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên giao diện Web

jobs:
  deobfuscate:
    runs-on: ubuntu-latest

    steps:
    # 1. Tải bộ công cụ Prometheus từ tài khoản của bạn vào máy chủ ảo
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Lua 5.1 (MoonSec V3 chạy trên nền tảng này)
    - name: Set up Lua
      uses: leafo/gh-actions-lua@v10
      with:
        luaVersion: "5.1"

    # 3. Chạy lệnh giải mã file input.lua bằng pipeline của Prometheus
    - name: Run Prometheus Deobfuscator
      run: |
        if [ -f "input.lua" ]; then
          lua src/deob/pipeline.lua --input input.lua --output ket_qua_clean.lua
        else
          echo "ERROR: Khong tim thay file input.lua! Vui long doc lai Buoc 5."
          exit 1
        fi

    # 4. Xuất file mã nguồn đã gỡ sạch lên hệ thống để bạn tải về
    - name: Upload Clean Script
      uses: actions/upload-artifact@v4
      with:
        name: Source-Code-Da-Go
        path: ket_qua_clean.lua
