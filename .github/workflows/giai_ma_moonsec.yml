name: Deobfuscate Lua (MoonSec 3)

on:
  workflow_dispatch:
  push:
    paths:
      - 'input.lua'
      - 'src/deob/**'

jobs:
  deob:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repo fork của bạn (chứa src/deob/cli.lua + input.lua)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài Lua 5.1 + LuaRocks
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev luarocks
          sudo luarocks install luasocket
          sudo luarocks install luafilesystem

      # 3. Clone Prometheus obfuscator (wcrddn/Prometheus - bản đúng cho repo này)
      - name: Checkout Prometheus obfuscator
        uses: actions/checkout@v4
        with:
          repository: wcrddn/Prometheus
          path: Prometheus

      # 4. Verify cấu trúc thư mục
      - name: Verify structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== src/deob ==="
          ls -la src/deob/
          echo "=== Prometheus/src/prometheus ==="
          ls -la Prometheus/src/prometheus/

      # 5. Kiểm tra input.lua tồn tại
      - name: Check input file
        run: |
          if [ ! -f "input.lua" ]; then
            echo "ERROR: Khong tim thay file input.lua!"
            exit 1
          fi

      # 6. Chạy CLI deobfuscator (KHÔNG phải pipeline.lua)
      - name: Run deobfuscation
        run: |
          export LUA_PATH="src/deob/?.lua;src/deob/?/init.lua;Prometheus/src/?.lua;Prometheus/src/?/init.lua;;"
          lua src/deob/cli.lua input.lua --trace off --out ket_qua_clean.lua

      # 7. DEBUG: Kiểm tra file output có được tạo không
      - name: List output files
        run: |
          echo "=== Files in root after run ==="
          ls -la
          echo "=== All .lua files ==="
          find . -name "*.lua" -newer input.lua

      # 8. Upload kết quả
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ket_qua_clean
          path: ket_qua_clean.lua
          if-no-files-found: error
